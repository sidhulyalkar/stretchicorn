name: Qualify v0.25 Storybook Meadow
on:
  push:
    branches: [feat/v0.25-storybook-meadow]
permissions:
  contents: write
jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v0.25-storybook-meadow
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deterministic compressor
        run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Build exact release
        run: npm run release:competition
      - name: Install browser harness
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Extract exact submission
        run: |
          rm -rf .tmp-js13k
          mkdir .tmp-js13k
          python -m zipfile -e dist/stretchicorn-js13k.zip .tmp-js13k
      - name: Chromium exact ZIP
        env: { BROWSER: chromium, BROWSER_HTML: .tmp-js13k/index.html }
        run: npm run browser:smoke
      - name: Firefox exact ZIP
        env: { BROWSER: firefox, BROWSER_HTML: .tmp-js13k/index.html }
        run: npm run browser:smoke
      - name: Chromium standalone
        env: { BROWSER: chromium, BROWSER_HTML: dist/stretchicorn-local.html }
        run: npm run browser:file-smoke
      - name: Firefox standalone
        env: { BROWSER: firefox, BROWSER_HTML: dist/stretchicorn-local.html }
        run: npm run browser:file-smoke
      - name: Wavedash isolation
        run: npm run wavedash:test
      - name: Re-freeze exact release
        run: npm run release:competition
      - name: Commit qualified artifacts
        shell: bash
        run: |
          git add dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Freeze qualified v0.25 competition artifacts"
          git push origin HEAD:feat/v0.25-storybook-meadow
