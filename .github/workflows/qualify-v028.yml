name: Qualify v0.28 Boss Trilogy
on:
  push:
    branches: [feat/v0.28-boss-trilogy]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v0.28-boss-trilogy
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Boss source contract
        run: |
          node --check src/03-bosses-v028.js
          grep -q "HIDEAWAY HUSK" src/03-bosses-v028.js
          grep -q "THE KERNEL COLONEL" src/03-bosses-v028.js
          grep -q "THE COBNOCOPIA" src/03-bosses-v028.js
          grep -q "FINAL FEAST" src/03-bosses-v028.js
      - name: Build readable artifact
        run: npm run build
      - name: Pack and measure exact release
        run: |
          npm run pack:competition
          npm run verify:offline
          python scripts/package.py
          npm run verify:archive || true
          npm run check:size || true
