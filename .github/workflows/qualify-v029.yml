name: Qualify v0.29 parry trials

on:
  push:
    branches:
      - feat/v0.29-parry-trials

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  qualify:
    if: ${{ !contains(github.event.head_commit.message, '[freeze-v029]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deterministic compressor
        run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Run full deterministic release qualification
        run: npm run release:competition
      - name: Freeze exact qualified artifacts
        shell: bash
        run: |
          rm -f dist/stretchicorn-desktop-v0.28.0.zip
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "Freeze qualified v0.29 artifacts [freeze-v029]"
            git push
          fi
      - name: Print exact artifact fingerprint
        run: |
          wc -c dist/stretchicorn-js13k.zip
          sha256sum dist/stretchicorn-js13k.zip

  browser-smoke:
    name: Browser smoke (${{ matrix.browser }})
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Extract exact submitted ZIP
        shell: bash
        run: |
          rm -rf .tmp-js13k
          mkdir .tmp-js13k
          python -m zipfile -e dist/stretchicorn-js13k.zip .tmp-js13k
          test -f .tmp-js13k/index.html
      - name: Install pinned Playwright harness
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run exact submitted ZIP smoke
        env:
          BROWSER: ${{ matrix.browser }}
          BROWSER_HTML: .tmp-js13k/index.html
        run: npm run browser:smoke
      - name: Open standalone playtest directly from disk
        env:
          BROWSER: ${{ matrix.browser }}
          BROWSER_HTML: dist/stretchicorn-local.html
        run: npm run browser:file-smoke
