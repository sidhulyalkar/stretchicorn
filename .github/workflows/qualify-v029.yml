name: Qualify v0.29 Parry Final Exam
on:
  push:
    branches: [feat/v0.29-parry-final-exam]
permissions:
  contents: read
concurrency:
  group: qualify-v029-${{ github.ref }}
  cancel-in-progress: true
jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Source parse
        run: |
          node --check src/03-bosses-v028.js
          node --check scripts/build.mjs
      - name: Build and package exact artifact
        run: |
          npm run build
          npm run pack:competition
          npm run verify:offline
          python3 scripts/package.py
          npm run verify:archive
          npm run check:size
