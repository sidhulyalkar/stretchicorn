name: Qualify v0.29 Parry Final Exam
on:
  push:
    branches: [feat/v0.29-parry-final-exam]
permissions:
  contents: read
concurrency:
  group: qualify-v029-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Source parse
        run: |
          node --check src/*.js
          node --check scripts/build.mjs
          node --check scripts/test.mjs
          node --check scripts/release-smoke.mjs
          node --check scripts/debug-v029.mjs
      - name: Generated reflected-bullet diagnostic
        run: |
          npm run build
          node scripts/debug-v029.mjs
      - name: Full release contract
        run: npm run release:competition
      - name: Wavedash isolation
        run: npm run wavedash:test
      - name: Artifact identity
        run: |
          sha256sum dist/stretchicorn-js13k.zip dist/stretchicorn-desktop-v0.29.0.zip
          cmp dist/stretchicorn-js13k.zip dist/stretchicorn-desktop-v0.29.0.zip
