name: Qualify v0.34 boss art

on:
  push:
    branches:
      - feat/v0.33-the-split

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  qualify:
    if: ${{ !contains(github.event.head_commit.message, '[freeze-v034]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - run: npm run release:competition
      - run: |
          wc -c dist/index.html dist/stretchicorn-js13k.zip
          sha256sum dist/stretchicorn-js13k.zip

  browser-smoke:
    if: ${{ !contains(github.event.head_commit.message, '[freeze-v034]') }}
    needs: qualify
    name: Browser smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - run: npm run release:competition
      - run: |
          rm -rf .tmp-js13k
          mkdir .tmp-js13k
          python -m zipfile -e dist/stretchicorn-js13k.zip .tmp-js13k
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - env:
          BROWSER: ${{ matrix.browser }}
          BROWSER_HTML: .tmp-js13k/index.html
        run: npm run browser:smoke
      - env:
          BROWSER: ${{ matrix.browser }}
          BROWSER_HTML: dist/stretchicorn-local.html
        run: npm run browser:file-smoke

  visual-proof:
    if: ${{ !contains(github.event.head_commit.message, '[freeze-v034]') }}
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - run: npm run release:competition
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Capture exact boss silhouettes
        run: |
          mkdir -p boss-proof
          node <<'NODE'
          const {chromium}=require('playwright'),path=require('path');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:960,height:640}});await p.goto('file://'+path.resolve('dist/stretchicorn-local.html'));await p.waitForTimeout(150);
          async function snap(w,n,open=0){await p.evaluate(({w,open})=>{mode=1;D=1;wave=w;hitstop=0;spawnWave();E[0].in=0;stageT=0;msgT=0;if(open){E[0].g=0;E[0].state=2}draw()},{w,open});await p.locator('canvas').screenshot({path:'boss-proof/'+n+'.png'})}
          await snap(5,'hideaway-closed');await snap(5,'hideaway-open',1);await snap(9,'kernel-colonel');await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v034-boss-proof
          path: boss-proof/*.png
          if-no-files-found: error

  freeze:
    if: ${{ !contains(github.event.head_commit.message, '[freeze-v034]') }}
    needs: [qualify, browser-smoke, visual-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - run: npm run release:competition
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "Freeze qualified v0.34 boss-art artifacts [freeze-v034]"
            git push
          fi
      - run: |
          wc -c dist/stretchicorn-js13k.zip
          sha256sum dist/stretchicorn-js13k.zip
