name: Verify 13KB build
on:
  push:
    branches:
      - release/v0.21.0-performance-lock
      - platform/wavedash-v0.21.0
  pull_request:
    branches:
      - main
      - release/v0.21.0-performance-lock
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install zopfli
      - run: npm run verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stretchicorn-13k-candidate
          path: dist/stretchicorn-desktop-v0.21.1.zip
