name: Verify js13k competition release

on:
  push:
    branches:
      - main
      - release/v0.21.0-performance-lock
      - platform/wavedash-v0.21.0
  pull_request:
    branches:
      - main
      - release/v0.21.0-performance-lock

permissions:
  contents: read

concurrency:
  group: verify-13k-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  competition-integrity:
    name: Competition integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic compressor
        run: python -m pip install --disable-pip-version-check zopfli==0.4.3

      - name: Rebuild and verify competition release
        run: npm run release:competition

      - name: Require committed competition artifacts to match source
        shell: bash
        run: |
          dirty="$(git status --porcelain --untracked-files=all -- dist)"
          if [[ -n "$dirty" ]]; then
            echo "Competition artifact is stale. Run: npm run release:competition"
            echo "$dirty"
            exit 1
          fi

      - name: Print release fingerprints
        run: sha256sum dist/stretchicorn-js13k.zip dist/stretchicorn-desktop-v*.zip

  browser-smoke:
    name: Browser smoke (${{ matrix.browser }})
    needs: competition-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build exact browser artifact
        run: npm run build

      - name: Install pinned Playwright harness
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run real-browser offline smoke
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm run browser:smoke
