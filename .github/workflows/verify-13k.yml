name: Verify 13KB build

on:
  push:
    branches:
      - main
      - release/v0.21.0-performance-lock
      - platform/wavedash-v0.21.0
  pull_request:
    branches:
      - main
      - release/v0.21.0-performance-lock

permissions:
  contents: read

concurrency:
  group: verify-13k-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deterministic compressor
        run: python3 -m pip install --user zopfli==0.4.3

      - name: Verify tests, smoke, package, and 13KB limit
        run: npm run verify

      - name: Require committed competition artifact to match source
        shell: bash
        run: |
          dirty="$(git status --porcelain --untracked-files=all -- dist)"
          if [[ -n "$dirty" ]]; then
            echo "Competition artifact is stale. Run: npm run release:competition"
            echo "$dirty"
            exit 1
          fi
