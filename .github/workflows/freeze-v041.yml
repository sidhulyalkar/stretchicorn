name: Freeze v041 artifacts
on:
  push:
    branches: [feat/easy-first-flight-guide]
    paths: ['.github/workflows/freeze-v041.yml']
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {ref: feat/easy-first-flight-guide}
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - run: npm run release:competition
      - name: Commit exact generated artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          git diff --cached --quiet && exit 0
          git commit -m 'build: freeze v0.41 competition artifacts'
          git push origin HEAD:feat/easy-first-flight-guide
