name: Freeze stacked playtest
on:
  push:
    branches: [feat/hay-bales-mouse-controls]
    paths: ['.github/workflows/freeze-stack.yml']
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - run: npm run release:competition
      - name: Freeze exact dist
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "build: freeze stacked competition artifacts"
            git push
          fi
