name: Apply v0.34 boss art

on:
  push:
    branches:
      - feat/v0.33-the-split

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[apply-v034]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Replace retired boss renderer with v0.34 art seam
        run: |
          node <<'NODE'
          const fs=require('fs');
          let p='src/03-bosses-v028.js',s=fs.readFileSync(p,'utf8');
          let a=s.indexOf('function bossFace('),b=s.indexOf('\nblock=function(',a);
          if(a<0||b<0)throw Error('old boss-face seam missing');
          s=s.slice(0,a)+s.slice(b+1);
          fs.writeFileSync(p,s);
          p='scripts/build.mjs';s=fs.readFileSync(p,'utf8');
          const old="'03-bosses-v028.js','03-story-v033.js'",neu="'03-bosses-v028.js','03-boss-art-v034.js','03-story-v033.js'";
          if(!s.includes(old))throw Error('build file list seam missing');
          s=s.replace(old,neu);
          fs.writeFileSync(p,s);
          NODE
      - run: npm run release:competition
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/03-bosses-v028.js scripts/build.mjs
          git commit -m "Install compact v0.34 boss renderer [apply-v034]"
          git push
