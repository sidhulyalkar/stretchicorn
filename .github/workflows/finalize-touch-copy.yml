name: Finalize touch-copy polish

on:
  push:
    branches:
      - polish/readable-style-title-spacing

permissions:
  contents: write

concurrency:
  group: finalize-touch-copy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/readable-style-title-spacing
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Synchronize qualified metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old='371f627c1750e09edababa22d68909069b82697bfbd22d3756dd250392fc6f16'
          new='31c2d2e32fb30755405f7821b34e05f9cbae9f0ec52fb010fa2f1fe6234daf3f'
          for name in ['README.md','RELEASING.md','PLAY_LOCAL.md']:
              p=Path(name); s=p.read_text()
              s=s.replace('13,309 / 13,312 bytes','13,311 / 13,312 bytes')
              s=s.replace('3 bytes free','1 byte free')
              s=s.replace('3 bytes of headroom','1 byte of headroom')
              s=s.replace(old,new)
              if name=='README.md':
                  s=s.replace('13,309 byte js13k ZIP','13,311 byte js13k ZIP')
                  s=s.replace('**99.977% of the 13,312 byte limit**','**99.992% of the 13,312 byte limit**')
              p.write_text(s)
          PY
      - name: Rebuild exact qualified release
        run: npm run release:competition
      - name: Commit exact metadata and artifacts
        shell: bash
        run: |
          rm .github/workflows/finalize-touch-copy.yml
          git add README.md RELEASING.md PLAY_LOCAL.md dist/index.html dist/stretchicorn-local.html dist/stretchicorn-js13k.zip dist/stretchicorn-desktop-v0.39.0.zip .github/workflows/finalize-touch-copy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Qualify touch-copy polish at 13,311 bytes'
          git push origin HEAD:polish/readable-style-title-spacing
