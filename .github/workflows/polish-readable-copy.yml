name: One-shot readable Style polish

on:
  push:
    branches:
      - polish/readable-style-title-spacing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/readable-style-title-spacing
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply scoped copy polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          changes={
            'src/03-title-v037.js':[
              ("STRETCH SNAP SHUCK","STRETCH    SNAP    SHUCK"),
              ("|STYLE|↑ difficulty = ↑ Style|Aggression + close grazes/parries = ↑ Style","|STYLE|Higher difficulty = more Style|Aggression + close grazes/parries = more Style"),
              ("Touch with body/head","Touch body/head"),
            ],
            'scripts/test-v037.mjs':[
              ("'STRETCH SNAP SHUCK'","'STRETCH    SNAP    SHUCK'"),
            ],
            'scripts/test-v040.mjs':[
              ("'|STYLE|↑ difficulty = ↑ Style|'","'|STYLE|Higher difficulty = more Style|'"),
              ("'Aggression + close grazes/parries = ↑ Style'","'Aggression + close grazes/parries = more Style'"),
              ("'Touch with body/head'","'Touch body/head'"),
              ("'BOSSES','Higher difficulty = more Style','Aggression + close grazes/parries = more Style'","'BOSSES','↑ difficulty = ↑ Style','Aggression + close grazes/parries = ↑ Style'"),
              ("compact Goal/Style arrow labels","compact Goal/readable Style labels"),
            ],
            'scripts/test-v042.mjs':[
              ("['|STYLE|↑ difficulty = ↑ Style|','Aggression + close grazes/parries = ↑ Style']","['|STYLE|Higher difficulty = more Style|','Aggression + close grazes/parries = more Style']"),
              ("'Higher difficulty = more Style','Aggression + close grazes/parries = more Style'","'↑ difficulty = ↑ Style','Aggression + close grazes/parries = ↑ Style'"),
            ],
          }
          for name,repls in changes.items():
              p=Path(name); s=p.read_text()
              for old,new in repls:
                  if old not in s: raise SystemExit(f'missing replacement in {name}: {old}')
                  s=s.replace(old,new)
              p.write_text(s)
          Path('.github/workflows/polish-readable-copy.yml').unlink()
          PY
          npm run build
          node scripts/run-regressions.mjs
      - name: Commit scoped polish
        shell: bash
        run: |
          git add src/03-title-v037.js scripts/test-v037.mjs scripts/test-v040.mjs scripts/test-v042.mjs .github/workflows/polish-readable-copy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore readable Style copy and space title hook'
          git push origin HEAD:polish/readable-style-title-spacing
