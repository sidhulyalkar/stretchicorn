name: Refresh standalone playtest

on:
  push:
    branches: [feat/v0.22-rainbow-theatre]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v0.22-rainbow-theatre
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build standalone HTML
        run: npm run build
      - name: Install browser harness
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Chromium direct-file smoke
        env:
          BROWSER: chromium
          BROWSER_HTML: dist/stretchicorn-local.html
        run: npm run browser:file-smoke
      - name: Firefox direct-file smoke
        env:
          BROWSER: firefox
          BROWSER_HTML: dist/stretchicorn-local.html
        run: npm run browser:file-smoke
      - name: Commit verified standalone HTML
        shell: bash
        run: |
          git add dist/stretchicorn-local.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh standalone local playtest HTML"
          git push origin HEAD:feat/v0.22-rainbow-theatre
