name: Refresh js13k dist

on:
  push:
    branches:
      - chore/js13k-release-artifact

permissions:
  contents: write

concurrency:
  group: refresh-js13k-dist
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: chore/js13k-release-artifact

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deterministic compressor
        run: python3 -m pip install --user zopfli==0.4.3

      - name: Regenerate verified competition artifacts
        run: npm run release:competition

      - name: Commit refreshed dist if needed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- dist)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "Refresh deterministic js13k competition artifacts"
            git push origin HEAD:chore/js13k-release-artifact
          else
            echo "dist is already current"
          fi
