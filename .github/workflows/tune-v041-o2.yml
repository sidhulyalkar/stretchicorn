name: Tune v041 O2
on:
  push:
    branches: [feat/easy-first-flight-guide]
    paths: ['.github/workflows/tune-v041-o2.yml']
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - run: npm run build
      - name: Measure concise gameplay hints
        run: |
          node - <<'NODE'
          const{readFileSync,writeFileSync}=require('fs'),p='dist/index.html';let s=readFileSync(p,'utf8');for(const[a,b]of[['BODY TAKES DAMAGE • HORN IS SAFE','BODY HURTS • HORN SAFE'],['HUSK SHIELD BLOCKS HITS • STRIKE WHEN IT FIRES','HUSK OPENS WHILE FIRING'],['ROUND KERNELS • HIT WITH HORN TO RETURN','HORN RETURNS GOLD KERNELS'],['RETURN ROUND KERNELS INTO THE SHIELD','RETURN GOLD INTO SHIELD'],['RED HATCH = BLOCK ABOUT TO FORM','RED HATCH → BLOCK'],['PHASE I • SHIELD CLOSED • ATTACK ONLY WHEN OPEN','PHASE I • WAIT FOR OPEN CORE'],['CYAN SPIKES CANNOT BE RETURNED • DODGE','CYAN SPIKES • DODGE'],['PHASE II • RETURN KERNELS INTO BOTH CORES','PHASE II • RETURN INTO BOTH CORES'],['SHIELD OPEN • RETURN FIRE','SHIELD OPEN • RETURN']])s=s.replaceAll(a,b);writeFileSync(p,s)
          NODE
          node scripts/pack-competition.mjs
          python3 scripts/package.py
          wc -c dist/index.html dist/stretchicorn-js13k.zip
