name: Qualify v0.22 Heavy Drop

on:
  push:
    branches:
      - feat/v0.22-rainbow-theatre
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualify-v022-impact
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deterministic compressor
        run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Preserve readable impact build
        run: |
          npm run build
          cp dist/index.html .tmp-readable.html
      - name: Build and verify exact js13k release
        run: npm run release:competition
      - name: Print exact release fingerprint
        run: |
          wc -c dist/stretchicorn-js13k.zip
          sha256sum dist/stretchicorn-js13k.zip
      - name: Verify Wavedash isolation
        run: npm run wavedash:test
      - name: Extract exact submitted ZIP
        run: |
          rm -rf .tmp-js13k
          mkdir .tmp-js13k
          python -m zipfile -e dist/stretchicorn-js13k.zip .tmp-js13k
          test -f .tmp-js13k/index.html
      - name: Install pinned browser harness
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Chromium exact submission smoke
        env:
          BROWSER: chromium
          BROWSER_HTML: .tmp-js13k/index.html
        run: npm run browser:smoke
      - name: Firefox exact submission smoke
        env:
          BROWSER: firefox
          BROWSER_HTML: .tmp-js13k/index.html
        run: npm run browser:smoke
      - name: Chromium Heavy Drop / scar / final-release smoke
        env:
          BROWSER: chromium
          BROWSER_HTML: .tmp-readable.html
          IMPACT: '1'
        run: npm run browser:smoke
      - name: Firefox Heavy Drop / scar / final-release smoke
        env:
          BROWSER: firefox
          BROWSER_HTML: .tmp-readable.html
          IMPACT: '1'
        run: npm run browser:smoke
