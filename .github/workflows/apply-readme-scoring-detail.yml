name: Apply detailed scoring README

on:
  push:
    branches:
      - fix/clickable-pause-guide-g
    paths:
      - .github/workflows/apply-readme-scoring-detail.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/clickable-pause-guide-g
          fetch-depth: 0
      - name: Apply scoring documentation
        run: python scripts/apply-readme-scoring-docs.py
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: explain difficulty-aware Style scoring"
          git push origin HEAD:fix/clickable-pause-guide-g
