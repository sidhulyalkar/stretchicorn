name: Sync exact competition artifacts

on:
  push:
    branches:
      - feat/controls-audio-rebind

permissions:
  contents: write

concurrency:
  group: sync-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/controls-audio-rebind
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - run: npm run release:competition
      - name: Commit exact generated artifacts if needed
        shell: bash
        run: |
          git add dist/index.html dist/stretchicorn-local.html dist/stretchicorn-js13k.zip dist/stretchicorn-desktop-v0.39.0.zip
          if git diff --cached --quiet; then
            echo 'Artifacts already exact'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync exact qualified competition artifacts'
          git push origin HEAD:feat/controls-audio-rebind
