name: Apply chapter motifs

on:
  push:
    branches:
      - feat/v0.22-rainbow-theatre

permissions:
  contents: write

concurrency:
  group: apply-chapter-motifs
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v0.22-rainbow-theatre
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/apply-chapter-motifs.mjs
      - name: Commit transformed render source
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- src/03-render.js)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/03-render.js
            git commit -m "Add distinct procedural chapter motifs"
            git push origin HEAD:feat/v0.22-rainbow-theatre
          fi
