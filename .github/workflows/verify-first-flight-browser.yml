name: Verify First Flight completion
on:
  push:
    branches:
      - feat/v0.23-storybook-reframe
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v0.23-storybook-reframe
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium firefox
      - run: |
          rm -rf .tmp-js13k
          mkdir .tmp-js13k
          python -m zipfile -e dist/stretchicorn-js13k.zip .tmp-js13k
      - name: Complete First Flight in Chromium
        env:
          BROWSER: chromium
          BROWSER_HTML: .tmp-js13k/index.html
        run: npm run browser:smoke
      - name: Complete First Flight in Firefox
        env:
          BROWSER: firefox
          BROWSER_HTML: .tmp-js13k/index.html
        run: npm run browser:smoke
