name: Apply Heavy Drop impact pass

on:
  push:
    branches:
      - feat/v0.22-rainbow-theatre

permissions:
  contents: write

concurrency:
  group: apply-heavy-drop
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v0.22-rainbow-theatre
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/apply-heavy-drop.mjs
      - name: Commit transformed source
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- src/00-core.js src/01-combat.js src/03-render.js src/04-ui-input.js)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/00-core.js src/01-combat.js src/03-render.js src/04-ui-input.js
            git commit -m "Implement Heavy Drop and living scar finale"
            git push origin HEAD:feat/v0.22-rainbow-theatre
          fi
