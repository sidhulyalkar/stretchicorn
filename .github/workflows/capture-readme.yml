name: Capture README game visuals

on:
  push:
    branches:
      - docs/professional-showcase

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/professional-showcase
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned Playwright harness
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture actual game canvases
        run: node scripts/capture-readme.mjs
      - name: Commit screenshots
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/screenshots/*.png
          git commit -m 'docs: add actual in-game showcase captures'
          git push origin HEAD:docs/professional-showcase
