name: Search v0.24 Roadroller Model
on:
  push:
    branches: [feat/v0.24-render-quality]
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v0.24-render-quality
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Materialize v0.24 source
        run: |
          python scripts/fix-v024.py
          python scripts/apply-v024.py
          npm run build
      - name: Terser top-level pass
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('dist/index.html').read_text();a=h.index('<script>')+8;b=h.rindex('</script>');Path('.tmp-game.js').write_text(h[a:b])
          PY
          npx --yes terser@5.50.0 .tmp-game.js --compress passes=5,toplevel=true --mangle toplevel=true --ecma 2020 --output .tmp-min.js
          wc -c .tmp-min.js
      - name: Search deeper Roadroller model
        run: |
          npx --yes roadroller@2.1.0 -O2 -D .tmp-min.js -o .tmp-packed.js | tee roadroller.log
          wc -c .tmp-packed.js
          tail -80 roadroller.log
