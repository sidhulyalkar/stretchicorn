name: Apply Rainbow Theatre source pass

on:
  push:
    branches:
      - feat/v0.22-rainbow-theatre

permissions:
  contents: write

concurrency:
  group: apply-rainbow-theatre
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/v0.22-rainbow-theatre

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply asserted source transformation
        run: node scripts/apply-rainbow-theatre.mjs

      - name: Commit transformed source if needed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- src scripts/build.mjs scripts/test.mjs)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src scripts/build.mjs scripts/test.mjs
            git commit -m "Implement Rainbow Theatre gameplay and presentation"
            git push origin HEAD:feat/v0.22-rainbow-theatre
          else
            echo "Rainbow Theatre source already applied"
          fi
