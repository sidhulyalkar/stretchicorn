# One-shot artifact freezer for the already-qualified impact build.
name: Freeze v0.22 Heavy Drop artifact

on:
  push:
    branches:
      - feat/v0.22-rainbow-theatre
    paths:
      - .github/workflows/freeze-v022-impact-dist.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v0.22-rainbow-theatre
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Rebuild exact qualified artifact
        shell: bash
        run: |
          set -euo pipefail
          npm run release:competition
          test "$(wc -c < dist/stretchicorn-js13k.zip)" -eq 12420
          echo 'a5d6bde0f3e3dbf134171550e962c5fb322c9a4b20629cbaff61e941bea70271  dist/stretchicorn-js13k.zip' | sha256sum -c -
      - name: Commit exact dist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo 'dist already exact'
          else
            git commit -m "Freeze qualified v0.22 Heavy Drop artifacts"
            git push origin HEAD:feat/v0.22-rainbow-theatre
          fi
