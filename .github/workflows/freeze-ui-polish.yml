name: Freeze polished UI candidate

on:
  push:
    branches:
      - feat/v042-popcorn-finale-style-summary

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v042-popcorn-finale-style-summary
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deterministic compressor
        run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Rebuild and test
        run: |
          npm run build
          node scripts/run-regressions.mjs
          npm run pack:competition
          npm run verify:offline
          python3 scripts/package.py
          npm run verify:archive
          npm run check:size
      - name: Refresh release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='d78c8a03bfb7d2aef4a89815bf56c87823847ad7853d23f9c8baec5972e174f2'
          new='ff8dc4532a654407be15d4b8f14f4c0a695b9cc712e13be56882c1347dd66912'
          for name in ['README.md','RELEASING.md','PLAY_LOCAL.md','CHANGELOG.md','docs/release-v039.md']:
              p=Path(name);s=p.read_text()
              for a,b in [
                  ('13,284 / 13,312','13,310 / 13,312'),
                  ('13,284 byte','13,310 byte'),
                  ('28 bytes free','2 bytes free'),
                  ('**28 free bytes**','**2 free bytes**'),
                  ('has 28 bytes of headroom','has 2 bytes of headroom'),
                  ('At 28 bytes free','At 2 bytes free'),
                  ('99.790%','99.985%'),
                  ('Twenty-eight spare bytes','Two spare bytes'),
                  (old,new),
              ]:s=s.replace(a,b)
              p.write_text(s)
          p=Path('README.md');s=p.read_text()
          s=s.replace('| **Mouse** | Aim the horn toward the pointer |\n| **Arrow Keys** | Aim the horn without mouse input |','| **Mouse / Arrow Keys** | Aim the horn |')
          s=s.replace('The Controls screen has a persistent **MOUSE AIM + CLICK ON/OFF** preference.','The Controls screen has a persistent **MOUSE - ON/OFF** preference. Mouse / Arrow Keys aim the horn, WASD moves the body, and Click / Space releases Rainbow Snap.')
          p.write_text(s)
          p=Path('docs/release-v039.md');s=p.read_text()
          note='The final UI pass moves control instructions off the title and into the translucent Controls panel, names the Field Guide explicitly, and shows the highest locally saved Style on the title after a player has recorded a score. Difficulty shortcuts now live directly on the four difficulty cards.\n\n'
          marker='## Final hardening pass\n\n'
          if note not in s:s=s.replace(marker,marker+note)
          p.write_text(s)
          PY
          npm run audit:release
      - name: Commit exact artifacts and docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist README.md RELEASING.md PLAY_LOCAL.md CHANGELOG.md docs/release-v039.md
          if git diff --cached --quiet; then
            echo 'Nothing to freeze'
          else
            git commit -m 'release: freeze 13,310-byte polished UI candidate'
            git push origin HEAD:feat/v042-popcorn-finale-style-summary
          fi
