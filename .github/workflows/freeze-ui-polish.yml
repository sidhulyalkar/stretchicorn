name: Freeze polished UI candidate

on:
  push:
    branches:
      - feat/v042-popcorn-finale-style-summary

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v042-popcorn-finale-style-summary
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deterministic compressor
        run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Rebuild and test
        run: |
          npm run build
          node scripts/run-regressions.mjs
          npm run pack:competition
          npm run verify:offline
          python3 scripts/package.py
          npm run verify:archive
          npm run check:size
      - name: Commit exact artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          if git diff --cached --quiet; then
            echo 'Nothing to freeze'
          else
            git commit -m 'release: freeze polished title and Controls candidate'
            git push origin HEAD:feat/v042-popcorn-finale-style-summary
          fi
