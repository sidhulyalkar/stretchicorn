name: Finalize readable Style polish

on:
  push:
    branches:
      - polish/readable-style-title-spacing

permissions:
  contents: write

concurrency:
  group: finalize-readable-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/readable-style-title-spacing
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Synchronize qualified metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old='80f6d6aad7f3a7882992402b1bf638928c4130f65ef6eb224408564dc9bc81d1'
          new='371f627c1750e09edababa22d68909069b82697bfbd22d3756dd250392fc6f16'
          for name in ['README.md','RELEASING.md']:
              p=Path(name); s=p.read_text()
              s=s.replace('13,312 / 13,312 bytes','13,309 / 13,312 bytes')
              s=s.replace('0 bytes free','3 bytes free')
              s=s.replace('0 bytes of headroom','3 bytes of headroom')
              s=s.replace(old,new)
              if name=='README.md':
                  s=s.replace('13,312 byte js13k ZIP','13,309 byte js13k ZIP')
                  s=s.replace('**100% of the 13,312 byte limit**','**99.977% of the 13,312 byte limit**')
              p.write_text(s)
          p=Path('PLAY_LOCAL.md'); s=p.read_text()
          s=s.replace('13,299 / 13,312 bytes','13,309 / 13,312 bytes').replace('13 bytes free','3 bytes free').replace('d16b1ed524a9e4df36933b3c03e61cd91dc3186cb5955be938e2bbf1b7d00ac7',new)
          p.write_text(s)
          PY
      - name: Rebuild exact qualified release
        run: npm run release:competition
      - name: Commit exact metadata and artifacts
        shell: bash
        run: |
          rm .github/workflows/finalize-readable-polish.yml
          git add README.md RELEASING.md PLAY_LOCAL.md dist/index.html dist/stretchicorn-local.html dist/stretchicorn-js13k.zip dist/stretchicorn-desktop-v0.39.0.zip .github/workflows/finalize-readable-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Qualify readable Style polish at 13,309 bytes'
          git push origin HEAD:polish/readable-style-title-spacing
