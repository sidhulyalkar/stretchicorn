name: Compression tournament

on:
  push:
    branches:
      - feat/v0.22-rainbow-theatre
  pull_request:
    branches:
      - chore/js13k-production-hardening
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deterministic compressor
        run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Build canonical artifact
        run: npm run build
      - name: Run source regression suite
        run: node scripts/test.mjs
      - name: Generate compression candidates
        run: node scripts/compression-tournament.mjs
      - name: Measure pinned Zopfli results
        run: python scripts/compression-report.py
      - name: VM smoke candidates that preserve the introspection surface
        shell: bash
        run: |
          set -euo pipefail
          cp dist/index.html .tmp-compression/original.html
          for candidate in .tmp-compression/candidates/00-current.html .tmp-compression/candidates/10-terser.html; do
            echo "=== VM smoke $candidate ==="
            cp "$candidate" dist/index.html
            node scripts/release-smoke.mjs
            node scripts/check-offline.mjs
          done
          cp .tmp-compression/original.html dist/index.html
      - name: Install pinned browser harness
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser-smoke every candidate
        shell: bash
        run: |
          set -euo pipefail
          for candidate in .tmp-compression/candidates/*.html; do
            echo "=== Chromium smoke $candidate ==="
            node scripts/check-offline.mjs "$candidate" || true
            BROWSER=chromium BROWSER_HTML="$candidate" node scripts/browser-smoke.mjs
          done
