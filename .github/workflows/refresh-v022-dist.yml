name: Refresh v0.22 competition artifact

on:
  push:
    branches:
      - feat/v0.22-rainbow-theatre

permissions:
  contents: write

concurrency:
  group: refresh-v022-dist
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/v0.22-rainbow-theatre

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic compressor
        run: python -m pip install --disable-pip-version-check zopfli==0.4.3

      - name: Build exact competition release
        run: npm run release:competition

      - name: Commit exact release artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist already current"
          else
            git commit -m "Refresh v0.22 competition artifacts"
            git push origin HEAD:feat/v0.22-rainbow-theatre
          fi
