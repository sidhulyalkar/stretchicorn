name: Harden dynamic block edge cases
on:
  push:
    branches: [polish/readable-style-title-spacing]
    paths: [.github/workflows/harden-block-edges.yml]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/readable-style-title-spacing
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Patch live-enemy wall invariant and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/02-update.js'); s=p.read_text()
          old="for(let e of [...E]){if(mode!=1)break;e.hit=Math.max(0,e.hit-dt);if(e.in>0)"
          new="for(let e of [...E]){if(mode!=1)break;e.hit=Math.max(0,e.hit-dt);if(hitW(e.x,e.y,e.r))e.x=e.x<W/2?e.r:W-e.r,e.vx=e.vy=0;if(e.in>0)"
          assert old in s; s=s.replace(old,new); p.write_text(s)

          p=Path('scripts/test-v044.mjs'); s=p.read_text()
          marker="const finite=()=>R('[A,P,...E,...B,...U].every(o=>Object.values(o).every(v=>typeof v!==\"number\"||Number.isFinite(v)))');"
          add="""R('mode=1;wave=1;bp=2;R.length=E.length=0;wall(75,120,110,80,1);let z=enemy(0,70,110);z.in=0;hearts=inv=1e6;V[0]=V[1]=0;upd(1/60)');assert.equal(R('!!hitW(E[0].x,E[0].y,E[0].r)'),false,'enemy embedded against world bound must escape hardened hay');\nR('mode=1;wave=1;bp=2;R.length=E.length=0;wall(90,270,110,80,1);wall(220,405,115,90,1);let z=enemy(6,192,351);z.in=0;hearts=inv=1e6;V[0]=V[1]=0;upd(1/60)');assert.equal(R('!!hitW(E[0].x,E[0].y,E[0].r)'),false,'large enemy must escape multi-block containment');\nR('mode=1;wave=12;bp=2;R.length=0;wall(300,250,110,82,1);E.length=0;let h=enemy(5,330,290);h.in=-1;killE(h);hearts=inv=1e6;V[0]=V[1]=0;upd(1/60)');assert.equal(R('E.every(e=>!hitW(e.x,e.y,e.r))'),true,'husk split children must escape active hay');\nfor(const w of[9,12,13]){const ok=R(`D=2.4;reset(${w});hearts=inv=1e6;V[0]=V[1]=0;let ok=1;for(let i=0;i<1200;i++){upd(1/60);if(bp==2&&E.some(e=>hitW(e.x,e.y,e.r))){ok=0;break}}ok`);assert.equal(ok,1,`active hay embedded a live enemy during dynamic-block soak, trial=${w}`)}\n"""
          assert marker in s; s=s.replace(marker,add+marker)
          s=s.replace('deterministic boss/difficulty soak','dynamic-block containment and deterministic boss/difficulty soak')
          p.write_text(s)
          PY
      - name: Build and qualify candidate bytes
        run: |
          npm run build
          node scripts/run-regressions.mjs
          npm run pack:competition
          npm run verify:offline
          python scripts/package.py
          npm run verify:archive
          npm run check:size
      - name: Synchronize exact release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          z=Path('dist/stretchicorn-js13k.zip').read_bytes(); size=len(z); limit=13312; free=limit-size; h=hashlib.sha256(z).hexdigest(); assert free>=0
          for name in ['README.md','RELEASING.md','PLAY_LOCAL.md']:
              p=Path(name); s=p.read_text()
              s=re.sub(r'\d{2},\d{3} / 13,312 bytes',f'{size:,} / 13,312 bytes',s)
              s=re.sub(r'\d+ bytes? free',f'{free} '+('byte' if free==1 else 'bytes')+' free',s)
              s=re.sub(r'SHA-256 [0-9a-f]{64}',f'SHA-256 {h}',s)
              if name=='README.md':
                  s=re.sub(r'\*\*[\d,]+ byte js13k ZIP\*\*',f'**{size:,} byte js13k ZIP**',s)
                  s=re.sub(r'\*\*\d+\.\d+% of the 13,312 byte limit\*\*',f'**{size/limit*100:.3f}% of the 13,312 byte limit**',s)
              p.write_text(s)
          print(size,free,h)
          PY
          npm run audit:release
      - name: Commit exact hardened candidate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/harden-block-edges.yml
          git add src/02-update.js scripts/test-v044.mjs README.md RELEASING.md PLAY_LOCAL.md dist
          git commit -m 'Prevent enemies from embedding in active hay'
          git push origin HEAD:polish/readable-style-title-spacing
