name: Harden dynamic block edge cases
on:
  push:
    branches: [polish/readable-style-title-spacing]
    paths: [.github/workflows/harden-block-edges.yml]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/readable-style-title-spacing
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Patch collision invariants and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/00-core.js'); s=p.read_text()
          old="function eject(q,o,r){let x=q.x-o.x-o.w/2,y=q.y-o.y-o.h/2;if(Math.abs(x/o.w)>Math.abs(y/o.h)){let s=x<0?-1:1;q.x=cl(s<0?o.x-r:o.x+o.w+r,r,W-r);q.vx=s*520}else{let s=y<0?-1:1;q.y=cl(s<0?o.y-r:o.y+o.h+r,96+r,H-r);q.vy=s*520}}"
          new="function eject(q,o,r){let x=q.x-o.x-o.w/2,y=q.y-o.y-o.h/2;if(Math.abs(x/o.w)>Math.abs(y/o.h)){let s=x<0?-1:1;q.x=cl(s<0?o.x-r:o.x+o.w+r,r,W-r);q.vx=s*520}else{let s=y<0?-1:1;q.y=cl(s<0?o.y-r:o.y+o.h+r,96+r,H-r);q.vy=s*520}if(hitW(q.x,q.y,r))q.x=o.x<W/2?W-r:r,q.y=o.y<H/2?H-r:96+r}"
          assert old in s; s=s.replace(old,new)
          old="function slamBlocks(){let h=0;for(let o of R)if(o.d){if(A.x+24>o.x&&A.x-24<o.x+o.w&&A.y+24>o.y&&A.y-24<o.y+o.h){eject(A,o,27);h=1}for(let e of E)if(e.x+e.r>o.x&&e.x-e.r<o.x+o.w&&e.y+e.r>o.y&&e.y-e.r<o.y+o.h)eject(e,o,e.r+2)}if(h){hurt();say('HUSK HARDENED! MOVE!',1);shake=15}flash=.12;snd(95,.08,.05,'square')}"
          new="function slamBlocks(){let o=hitW(A.x,A.y,24);if(o){eject(A,o,27);hurt();say('HUSK HARDENED! MOVE!',1);shake=15}flash=.12;snd(95,.08,.05,'square')}"
          assert old in s; s=s.replace(old,new); p.write_text(s)

          p=Path('src/02-update.js'); s=p.read_text()
          old="if(e.in>0){e.in-=dt;e.y+=(135-e.y)*dt*4;e.cd=1;continue}if(e.type==0||e.type==5)"
          new="if(e.in>0){e.in-=dt;e.y+=(135-e.y)*dt*4;e.cd=1;continue}let o=hitW(e.x,e.y,e.r);if(o)eject(e,o,e.r+2);if(e.type==0||e.type==5)"
          assert old in s; s=s.replace(old,new); p.write_text(s)

          p=Path('src/03-bosses-v028.js'); s=p.read_text()
          old="if(bp==1&&bt>1){bp=2;bt=0}else if(bp==2&&bt>1.3)"
          new="if(bp==1&&bt>1){bp=2;bt=0;slamBlocks()}else if(bp==2&&bt>1.3)"
          assert old in s; s=s.replace(old,new)
          old="if(e.tele<=0){bp=2;e.state=2;e.tele=.7;e.g=0;blast31(e,req31(1)+5,1);say('CORE OPEN • SNAP',.65)}"
          new="if(e.tele<=0){bp=2;slamBlocks();e.state=2;e.tele=.7;e.g=0;blast31(e,req31(1)+5,1);say('CORE OPEN • SNAP',.65)}"
          assert old in s; s=s.replace(old,new); p.write_text(s)

          p=Path('scripts/test-v044.mjs'); s=p.read_text()
          marker="const finite=()=>R('[A,P,...E,...B,...U].every(o=>Object.values(o).every(v=>typeof v!==\"number\"||Number.isFinite(v)))');"
          add="""R('mode=1;wave=1;bp=2;R.length=E.length=0;wall(75,120,110,80,1);let z=enemy(0,70,110);z.in=0;hearts=inv=1e6;V[0]=V[1]=0;upd(1/60)');assert.equal(R('!!hitW(E[0].x,E[0].y,E[0].r)'),false,'enemy embedded against top world bound must be evacuated from hardened hay');\nR('mode=1;wave=1;bp=2;R.length=E.length=0;wall(90,270,110,80,1);wall(220,405,115,90,1);let z=enemy(6,192,351);z.in=0;hearts=inv=1e6;V[0]=V[1]=0;upd(1/60)');assert.equal(R('!!hitW(E[0].x,E[0].y,E[0].r)'),false,'large enemy must not ping-pong between overlapping block clearances');\nR('mode=1;wave=12;bp=1;bt=1.01;R.length=0;wall(300,250,110,82,1);A.x=330;A.y=280;hearts=1e6;inv=0;phases31(0)');assert.equal(R('bp'),2,'boss block phase did not harden');assert.equal(R('!!hitW(A.x,A.y,24)'),false,'boss-authored block hardening must evacuate the player');\nfor(const w of[9,12,13]){const ok=R(`D=2.4;reset(${w});hearts=inv=1e6;V[0]=V[1]=0;let ok=1;for(let i=0;i<1200;i++){upd(1/60);if(bp==2&&E.some(e=>e.in<=0&&hitW(e.x,e.y,e.r))){ok=0;break}}ok`);assert.equal(ok,1,`active hay embedded a live enemy during dynamic-block soak, trial=${w}`)}\n"""
          assert marker in s; s=s.replace(marker,add+marker)
          s=s.replace('deterministic boss/difficulty soak','dynamic-block evacuation and deterministic boss/difficulty soak')
          p.write_text(s)
          PY
      - name: Build and qualify candidate bytes
        run: |
          npm run build
          node scripts/run-regressions.mjs
          npm run pack:competition
          npm run verify:offline
          python scripts/package.py
          npm run verify:archive
          npm run check:size
      - name: Synchronize exact release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          z=Path('dist/stretchicorn-js13k.zip').read_bytes(); size=len(z); limit=13312; free=limit-size; h=hashlib.sha256(z).hexdigest()
          assert free>=0
          for name in ['README.md','RELEASING.md','PLAY_LOCAL.md']:
              p=Path(name); s=p.read_text()
              s=re.sub(r'\d{2},\d{3} / 13,312 bytes',f'{size:,} / 13,312 bytes',s)
              s=re.sub(r'\d+ bytes? free',f'{free} '+('byte' if free==1 else 'bytes')+' free',s)
              s=re.sub(r'SHA-256 [0-9a-f]{64}',f'SHA-256 {h}',s)
              if name=='README.md':
                  s=re.sub(r'\*\*[\d,]+ byte js13k ZIP\*\*',f'**{size:,} byte js13k ZIP**',s)
                  s=re.sub(r'\*\*\d+\.\d+% of the 13,312 byte limit\*\*',f'**{size/limit*100:.3f}% of the 13,312 byte limit**',s)
              p.write_text(s)
          print(size,free,h)
          PY
          npm run audit:release
      - name: Commit exact hardened candidate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/harden-block-edges.yml
          git add src/00-core.js src/02-update.js src/03-bosses-v028.js scripts/test-v044.mjs README.md RELEASING.md PLAY_LOCAL.md dist
          git commit -m 'Harden dynamic block collision edges'
          git push origin HEAD:polish/readable-style-title-spacing
