name: Harden dynamic block edge cases
on:
  push:
    branches: [polish/readable-style-title-spacing]
    paths: [.github/workflows/harden-block-edges.yml]
permissions:
  contents: read
jobs:
  byte-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/readable-style-title-spacing
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Measure safe formulations
        shell: bash
        run: |
          cat > /tmp/variant.py <<'PY'
          from pathlib import Path
          import sys
          v=sys.argv[1]
          p=Path('src/02-update.js'); s=p.read_text()
          old="if(e.in>0){e.in-=dt;e.y+=(135-e.y)*dt*4;e.cd=1;continue}if(e.type==0||e.type==5)"
          if v.startswith('edge'):
              new="if(e.in>0){e.in-=dt;e.y+=(135-e.y)*dt*4;e.cd=1;continue}if(hitW(e.x,e.y,e.r))e.x=0;if(e.type==0||e.type==5)"
              assert old in s; s=s.replace(old,new); p.write_text(s)
          p=Path('scripts/test-v044.mjs'); s=p.read_text()
          marker="const finite=()=>R('[A,P,...E,...B,...U].every(o=>Object.values(o).every(v=>typeof v!==\"number\"||Number.isFinite(v)))');"
          add="""R('mode=1;wave=1;bp=2;R.length=E.length=0;wall(75,120,110,80,1);var z=enemy(0,70,110);z.in=0;hearts=inv=1e6;V[0]=V[1]=0;upd(1/60)');assert.equal(R('!!hitW(E[0].x,E[0].y,E[0].r)'),false,'enemy embedded against world bound must escape hardened hay');\nR('mode=1;wave=1;bp=2;R.length=E.length=0;wall(90,270,110,80,1);wall(220,405,115,90,1);var z=enemy(6,192,351);z.in=0;hearts=inv=1e6;V[0]=V[1]=0;upd(1/60)');assert.equal(R('!!hitW(E[0].x,E[0].y,E[0].r)'),false,'large enemy must escape multi-block containment');\nR('mode=1;wave=12;bp=2;R.length=0;wall(300,250,110,82,1);E.length=0;var h=enemy(5,330,290);h.in=-1;killE(h);hearts=inv=1e6;V[0]=V[1]=0;upd(1/60)');assert.equal(R('E.every(e=>!hitW(e.x,e.y,e.r))'),true,'husk split children must escape active hay');\nfor(const w of[9,12,13]){const ok=R(`D=2.4;reset(${w});hearts=inv=1e6;V[0]=V[1]=0;var ok=1;for(var i=0;i<1200;i++){upd(1/60);if(bp==2&&E.some(e=>e.in<=0&&hitW(e.x,e.y,e.r))){upd(1/60);if(bp==2&&E.some(e=>e.in<=0&&hitW(e.x,e.y,e.r))){ok=0;break}}}ok`);assert.equal(ok,1,`active hay persistently embedded a live enemy, trial=${w}`)}\n"""
          assert marker in s; p.write_text(s.replace(marker,add+marker))
          if 'nostrict' in v:
              p=Path('scripts/build.mjs'); s=p.read_text(); s=s.replace("'<script>'+\"'use strict';\"+js+'</script>'","'<script>'+js+'</script>'",1); p.write_text(s)
          if 'nodoctype' in v:
              p=Path('scripts/build.mjs'); s=p.read_text(); s=s.replace("const html='<!doctype html>'+compShell", "const html=compShell",1); p.write_text(s)
          PY
          measure(){
            v=$1
            git checkout -- src/02-update.js scripts/test-v044.mjs scripts/build.mjs
            python /tmp/variant.py "$v"
            npm run build >/dev/null
            node scripts/run-regressions.mjs >/dev/null
            npm run pack:competition >/dev/null
            python scripts/package.py >/dev/null
            echo "SIZE $v $(stat -c%s dist/stretchicorn-js13k.zip)"
          }
          measure edge
          measure edge_nostrict
          measure edge_nodoctype
          measure edge_nostrict_nodoctype
