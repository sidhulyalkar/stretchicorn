name: Capture v0.25 Storybook Meadow Visual QA
on:
  push:
    branches: [feat/v0.25-storybook-meadow]
permissions:
  contents: read
jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v0.25-storybook-meadow
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Capture pastoral campaign scenes
        run: |
          mkdir -p visual-qa
          cat > .tmp-capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import { pathToFileURL } from 'node:url';
          import { resolve } from 'node:path';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:960,height:640}});
          await p.goto(pathToFileURL(resolve('dist/stretchicorn-local.html')).href);
          await p.waitForTimeout(220);
          const shot=async n=>{await p.waitForTimeout(120);await p.locator('#c').screenshot({path:`visual-qa/${n}.png`})};
          await shot('01-origin');
          await p.keyboard.press('Space');await p.waitForTimeout(180);await shot('02-first-flight');
          await p.keyboard.press('Escape');await p.waitForTimeout(180);await shot('03-withered-meadow');
          const set=async(w,d=.7)=>p.evaluate(({w,d})=>window.eval(`mode=1;D=${d};wave=${w};stageT=0;runT=12;queen=0;combo=2.8;E.length=B.length=U.length=R.length=0;spawnWave();stageT=0`),{w,d});
          await set(5);await shot('04-scarecrow-court-monarch');
          await set(9);await shot('05-drowned-furrows-architect');
          await set(12);await shot('06-prism-thicket');
          await set(13);await shot('07-cobtopus');
          await p.evaluate(()=>window.eval('mode=1;D=2.4;wave=13;stageT=0;runT=20;queen=3;combo=4;E.length=B.length=U.length=R.length=0;spawnWave();queen=3;stageT=0'));
          await shot('08-impossible-encore');
          await b.close();
          JS
          node .tmp-capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v025-storybook-meadow-visual-qa
          path: visual-qa/*.png
          if-no-files-found: error
