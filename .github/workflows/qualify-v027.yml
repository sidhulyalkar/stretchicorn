# v0.27 qualification trigger 2
name: Qualify v0.27 Living Color
on:
  push:
    branches: [feat/v0.27-living-color]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v0.27-living-color
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - name: Require Living Color source contract
        run: |
          grep -q "function colorRise" src/03-living-color-v027.js
          grep -q "globalCompositeOperation='saturation'" src/03-living-color-v027.js
          grep -q "ONE LIGHT REMAINED" src/03-living-color-v027.js
          grep -q "SO IT BECAME THE MISSING BODY" src/03-living-color-v027.js
      - name: Build exact competition release
        run: npm run release:competition
      - name: Install browser harness
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium firefox
      - name: Extract exact submission
        run: |
          rm -rf .tmp-js13k && mkdir .tmp-js13k
          python -m zipfile -e dist/stretchicorn-js13k.zip .tmp-js13k
      - name: Chromium exact ZIP
        env: {BROWSER: chromium, BROWSER_HTML: .tmp-js13k/index.html}
        run: npm run browser:smoke
      - name: Firefox exact ZIP
        env: {BROWSER: firefox, BROWSER_HTML: .tmp-js13k/index.html}
        run: npm run browser:smoke
      - name: Chromium standalone
        env: {BROWSER: chromium, BROWSER_HTML: dist/stretchicorn-local.html}
        run: npm run browser:file-smoke
      - name: Firefox standalone
        env: {BROWSER: firefox, BROWSER_HTML: dist/stretchicorn-local.html}
        run: npm run browser:file-smoke
      - name: Living Color visual regression Chromium
        env: {BROWSER: chromium, BROWSER_HTML: dist/stretchicorn-local.html}
        run: node scripts/color-smoke.mjs
      - name: Living Color visual regression Firefox
        env: {BROWSER: firefox, BROWSER_HTML: dist/stretchicorn-local.html}
        run: node scripts/color-smoke.mjs
      - name: Wavedash isolation
        run: npm run wavedash:test
      - name: Capture restoration story
        run: |
          mkdir -p visual-qa
          cat > .tmp-capture.mjs <<'JS'
          import{chromium}from'playwright';import{pathToFileURL}from'node:url';import{resolve}from'node:path';const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:960,height:640}});await p.goto(pathToFileURL(resolve('dist/stretchicorn-local.html')).href);const E=s=>p.evaluate(s=>window.eval(s),s),S=async n=>{await p.waitForTimeout(80);await p.locator('#c').screenshot({path:`visual-qa/${n}.png`})};for(const [q,n]of[[1.4,'01-broken'],[3.7,'02-last-light'],[5.8,'03-stitch'],[8.1,'04-awakening'],[10,'05-linger']]){await E(`mode=9;stageT=${q};draw()`);await S(n)}for(const [w,n]of[[1,'06-trial-01-grey'],[5,'07-trial-05'],[9,'08-trial-09'],[13,'09-trial-13-color']]){await E(`mode=1;D=.7;wave=${w};combo=1;nextWave=0;spawnWave();stageT=0;draw()`);await S(n)}await b.close();
          JS
          node .tmp-capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v027-living-color-visual-qa
          path: visual-qa/*.png
      - name: Freeze qualified v0.27 artifacts
        shell: bash
        run: |
          git add dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Freeze qualified v0.27 Living Color artifacts"
          git pull --rebase origin feat/v0.27-living-color
          git push origin HEAD:feat/v0.27-living-color
