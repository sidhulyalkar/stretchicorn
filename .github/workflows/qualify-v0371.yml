name: Qualify v0.37.1 no-intro fix

on:
  push:
    branches:
      - feat/v0.33-the-split

concurrency:
  group: v0371-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  qualify:
    if: ${{ !contains(github.event.head_commit.message, '[freeze-v0371]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - run: npm run release:competition
      - run: |
          if grep -Eq 'FIRST FLIGHT|T TRAINING|THE SPLIT|THE LIVING SCAR' dist/index.html; then exit 1; fi
          wc -c dist/index.html dist/stretchicorn-js13k.zip
          sha256sum dist/stretchicorn-js13k.zip

  browser-smoke:
    if: ${{ !contains(github.event.head_commit.message, '[freeze-v0371]') }}
    needs: qualify
    name: Browser smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - run: npm run release:competition
      - run: |
          rm -rf .tmp-js13k
          mkdir .tmp-js13k
          python -m zipfile -e dist/stretchicorn-js13k.zip .tmp-js13k
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - env:
          BROWSER: ${{ matrix.browser }}
          BROWSER_HTML: .tmp-js13k/index.html
        run: npm run browser:smoke
      - env:
          BROWSER: ${{ matrix.browser }}
          BROWSER_HTML: dist/stretchicorn-local.html
        run: npm run browser:file-smoke

  freeze:
    if: ${{ !contains(github.event.head_commit.message, '[freeze-v0371]') }}
    needs: [qualify, browser-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - run: npm run release:competition
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "Freeze qualified v0.37.1 artifacts [freeze-v0371]"
            git push
          fi
      - run: |
          wc -c dist/stretchicorn-js13k.zip
          sha256sum dist/stretchicorn-js13k.zip
