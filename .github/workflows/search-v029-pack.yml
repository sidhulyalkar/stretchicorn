name: Search v0.29 pack model
on:
  push:
    branches: [feat/v0.29-parry-final-exam]
permissions: {contents: read}
concurrency:
  group: pack-v029
  cancel-in-progress: true
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: npm run build
      - name: Prepare Terser input
        run: |
          mkdir -p .tmp-model
          node - <<'JS'
          const{readFileSync,writeFileSync}=require('fs'),h=readFileSync('dist/index.html','utf8'),a=h.indexOf('<script>')+8,b=h.lastIndexOf('</script>');writeFileSync('.tmp-model/game.js',h.slice(a,b));
          JS
          npx --yes terser@5.50.0 .tmp-model/game.js --compress passes=5,toplevel=true --mangle toplevel=true --ecma 2020 --output .tmp-model/min.js
      - name: Roadroller candidates
        run: |
          set -x
          npx --yes roadroller@2.1.0 -q -O0 -D -Zab22 -Zlr1910 -Zmd14 -S0,1,2,3,6,7,13,25,42,193,338,425 .tmp-model/min.js -o .tmp-model/current.js
          npx --yes roadroller@2.1.0 -q -O0 -D -Zab25 -Zlr1333 -Zmd11 -Zpr14 -S0,1,2,3,5,6,13,26,49,105,179,449 .tmp-model/min.js -o .tmp-model/old.js
          npx --yes roadroller@2.1.0 -q -O2 -D .tmp-model/min.js -o .tmp-model/opt.js || true
          wc -c .tmp-model/min.js .tmp-model/current.js .tmp-model/old.js .tmp-model/opt.js || true
          echo HELP
          npx --yes roadroller@2.1.0 --help | head -80
