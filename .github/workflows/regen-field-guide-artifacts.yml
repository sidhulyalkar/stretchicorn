name: Regenerate Field Guide artifacts

on:
  push:
    branches:
      - polish/field-guide-powerups

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: polish/field-guide-powerups
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deterministic compressor
        run: python -m pip install --disable-pip-version-check zopfli==0.4.3

      - name: Build and verify mechanics
        run: |
          npm run build
          node scripts/run-regressions.mjs
          npm run pack:competition
          npm run verify:offline
          python3 scripts/package.py
          npm run verify:archive
          npm run check:size

      - name: Refresh current release fingerprints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          z = Path('dist/stretchicorn-js13k.zip')
          size = z.stat().st_size
          limit = 13312
          free = limit - size
          digest = hashlib.sha256(z.read_bytes()).hexdigest()

          old_hash = '899ddff0a35c87085cf62f0d4e451732f2c53e4cf7b57dcce60723f434c3d3ec'
          for name in ['README.md', 'RELEASING.md', 'PLAY_LOCAL.md']:
              p = Path(name)
              s = p.read_text()
              s = s.replace('13,298 / 13,312 bytes', f'{size:,} / {limit:,} bytes')
              s = s.replace('13,298 byte js13k ZIP', f'{size:,} byte js13k ZIP')
              s = s.replace('14 bytes free', f'{free} bytes free')
              s = s.replace('14 bytes of headroom', f'{free} bytes of headroom')
              s = s.replace('At 14 bytes free', f'At {free} bytes free')
              s = s.replace(old_hash, digest)
              p.write_text(s)
          print(f'{size}/{limit} bytes, {free} free, sha256={digest}')
          PY
          npm run audit:release

      - name: Commit regenerated current artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist README.md RELEASING.md PLAY_LOCAL.md
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate Field Guide pickup copy artifacts'
          git push origin HEAD:polish/field-guide-powerups
