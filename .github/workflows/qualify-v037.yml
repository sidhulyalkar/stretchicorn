name: Qualify v0.37 title and Hard mode

on:
  push:
    branches:
      - feat/v0.37-title-hardmode

concurrency:
  group: v037-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - run: npm run release:competition
      - run: |
          wc -c dist/index.html dist/stretchicorn-js13k.zip
          sha256sum dist/stretchicorn-js13k.zip
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Capture title and late Hard proof
        run: |
          mkdir -p v037-proof
          node <<'NODE'
          const {chromium}=require('playwright'),path=require('path');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:960,height:640}});await p.goto('file://'+path.resolve('dist/stretchicorn-local.html'));await p.waitForTimeout(180);await p.locator('canvas').screenshot({path:'v037-proof/title.png'});await p.evaluate(()=>{D=1.6;reset();wave=12;spawnWave();stageT=0;msgT=0;for(let k=0;k<220;k++){for(let e of E)e.cd=0;upd(1/60)}draw()});await p.locator('canvas').screenshot({path:'v037-proof/hard-12.png'});await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v037-proof
          path: v037-proof/*.png
          if-no-files-found: error

  browser-smoke:
    needs: qualify
    name: Browser smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check zopfli==0.4.3
      - run: npm run release:competition
      - run: |
          rm -rf .tmp-js13k
          mkdir .tmp-js13k
          python -m zipfile -e dist/stretchicorn-js13k.zip .tmp-js13k
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - env:
          BROWSER: ${{ matrix.browser }}
          BROWSER_HTML: .tmp-js13k/index.html
        run: npm run browser:smoke
      - env:
          BROWSER: ${{ matrix.browser }}
          BROWSER_HTML: dist/stretchicorn-local.html
        run: npm run browser:file-smoke
