  <rect x="50" y="50" width="46" height="42" rx="8" fill="#241a31" stroke="#ffcf67" stroke-width="2"/><text x="73" y="78" fill="#fff" font-size="18">S</text>
  <rect x="100" y="50" width="46" height="42" rx="8" fill="#241a31" stroke="#ffcf67" stroke-width="2"/><text x="123" y="78" fill="#fff" font-size="18">D</text>
  <text x="73" y="122" fill="#ffcf67" font-size="16">MOVE BODY</text>
</g>
