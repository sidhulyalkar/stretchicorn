  <radialGradient id="body"><stop stop-color="#fff"/><stop offset=".72" stop-color="#f8f1ff"/><stop offset="1" stop-color="#cbbbe2"/></radialGradient>
  <linearGradient id="horn" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff4b0"/><stop offset="1" stop-color="#ffbd3f"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
