<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">How to control Stretchicorn</title>
<desc id="d">WASD moves the vulnerable body. Mouse or arrow keys aim the safe horn. Click or Space releases rainbow tension as a Snap. C opens Controls where mouse gameplay input can be disabled. Gold kernels can be parried and cyan spikes must be dodged.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090611"/><stop offset=".55" stop-color="#180b27"/><stop offset="1" stop-color="#250f35"/></linearGradient>
  <radialGradient id="body"><stop stop-color="#fff"/><stop offset=".72" stop-color="#f8f1ff"/><stop offset="1" stop-color="#cbbbe2"/></radialGradient>
  <linearGradient id="horn"><stop stop-color="#fff4b0"/><stop offset="1" stop-color="#ffbd3f"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="620" rx="30" fill="url(#bg)"/>
<text x="600" y="54" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" text-anchor="middle" letter-spacing="2">ONE CREATURE · TWO CONTROL POINTS · ONE SPRING</text>
<text x="600" y="86" fill="#bcaec9" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="1.5">PROTECT THE BODY · THROW THE HORN INTO DANGER · SNAP THE RAINBOW</text>
