<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">How to control Stretchicorn</title>
<desc id="d">WASD moves the vulnerable body, arrow keys aim the safe horn, and Space releases rainbow tension as a Snap. Gold kernels can be parried and cyan spikes must be dodged.</desc>
<defs>
