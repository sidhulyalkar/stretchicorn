  <g transform="translate(952 500)"><path d="M22 3 L39 22 L22 41 L5 22Z" fill="#54d9ff" stroke="#baf3ff" stroke-width="3"/><text x="49" y="19" fill="#72e3ff" font-size="15">CYAN SPIKE</text><text x="49" y="39" fill="#fff" font-size="14">DODGE ONLY ↗</text></g>
</g>
