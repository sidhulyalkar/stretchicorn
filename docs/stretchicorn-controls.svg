<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Stretchicorn controls</title>
  <desc id="desc">WASD moves the vulnerable body, arrow keys aim the safe head, Space attacks or Rainbow Snaps, P pauses, M returns to menu, and the rainbow charges when the body moves away from the horn direction.</desc>
  <rect width="1000" height="420" rx="28" fill="#11131a"/>
  <text x="500" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">THE TWO-HANDED UNICORN</text>
  <text x="500" y="78" fill="#b9bfd0" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">Move the body with one hand. Aim the horn with the other. Pull away to charge.</text>
  <g transform="translate(72 125)" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="90" y="0" fill="#ffda67" font-size="19" font-weight="700">MOVE BODY</text>
    <g fill="#232735" stroke="#767f98" stroke-width="2"><rect x="62" y="18" width="56" height="56" rx="9"/><rect x="0" y="80" width="56" height="56" rx="9"/><rect x="62" y="80" width="56" height="56" rx="9"/><rect x="124" y="80" width="56" height="56" rx="9"/></g>
    <g fill="#ffffff" font-size="23" font-weight="700"><text x="90" y="54">W</text><text x="28" y="116">A</text><text x="90" y="116">S</text><text x="152" y="116">D</text></g>
    <text x="90" y="167" fill="#b9bfd0" font-size="15">controls the vulnerable ♥</text>
  </g>
  <g transform="translate(280 140)">
    <line x1="70" y1="85" x2="360" y2="85" stroke="#ff5f87" stroke-width="18" stroke-linecap="round"/><line x1="115" y1="85" x2="160" y2="85" stroke="#ffb84d" stroke-width="18"/><line x1="160" y1="85" x2="205" y2="85" stroke="#ffe66d" stroke-width="18"/><line x1="205" y1="85" x2="250" y2="85" stroke="#79e58c" stroke-width="18"/><line x1="250" y1="85" x2="300" y2="85" stroke="#64cfff" stroke-width="18"/><line x1="300" y1="85" x2="360" y2="85" stroke="#b792ff" stroke-width="18" stroke-linecap="round"/>
    <circle cx="60" cy="85" r="32" fill="#ffffff"/><text x="60" y="94" fill="#ff4f73" font-family="system-ui, sans-serif" font-size="27" text-anchor="middle">♥</text><circle cx="372" cy="85" r="30" fill="#ffffff"/><polygon points="394,82 447,60 400,96" fill="#ffe978"/><path d="M354 60 Q370 30 390 55 Q370 47 364 68" fill="#ff82b4"/>
    <text x="60" y="138" fill="#ff8ca3" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">BODY = HEALTH</text><text x="372" y="138" fill="#a9e9ff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">HEAD = SAFE WEAPON</text>
    <path d="M60 35 H5" stroke="#ffe66d" stroke-width="4" marker-end="url(#arrowL)"/><text x="30" y="22" fill="#ffe66d" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">PULL</text><path d="M400 35 H465" stroke="#7ee3ff" stroke-width="4" marker-end="url(#arrowR)"/><text x="436" y="22" fill="#7ee3ff" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">AIM</text>
  </g>
  <g transform="translate(758 125)" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="90" y="0" fill="#75dcff" font-size="19" font-weight="700">AIM HEAD</text><g fill="#232735" stroke="#767f98" stroke-width="2"><rect x="62" y="18" width="56" height="56" rx="9"/><rect x="0" y="80" width="56" height="56" rx="9"/><rect x="62" y="80" width="56" height="56" rx="9"/><rect x="124" y="80" width="56" height="56" rx="9"/></g><g fill="#ffffff" font-size="25" font-weight="700"><text x="90" y="54">↑</text><text x="28" y="116">←</text><text x="90" y="116">↓</text><text x="152" y="116">→</text></g><text x="90" y="167" fill="#b9bfd0" font-size="15">continuous horn direction</text>
  </g>
  <g transform="translate(275 335)" font-family="system-ui, sans-serif"><rect x="0" y="0" width="190" height="52" rx="12" fill="#2b2442" stroke="#b792ff" stroke-width="2"/><text x="95" y="22" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">SPACE</text><text x="95" y="42" fill="#cfc4ff" font-size="13" text-anchor="middle">Horn / Rainbow Snap</text><rect x="215" y="0" width="120" height="52" rx="12" fill="#232735" stroke="#767f98" stroke-width="2"/><text x="275" y="22" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">P</text><text x="275" y="42" fill="#b9bfd0" font-size="13" text-anchor="middle">Pause</text><rect x="360" y="0" width="120" height="52" rx="12" fill="#232735" stroke="#767f98" stroke-width="2"/><text x="420" y="22" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">M</text><text x="420" y="42" fill="#b9bfd0" font-size="13" text-anchor="middle">Menu</text></g>
  <defs><marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7ee3ff"/></marker><marker id="arrowL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#ffe66d"/></marker></defs>
</svg>
