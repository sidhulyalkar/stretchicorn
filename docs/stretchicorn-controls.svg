<text x="600" y="585" fill="#cbbbd2" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">C → CONTROLS → MOUSE - ON / OFF · ARROWS + SPACE STAY ACTIVE</text>
