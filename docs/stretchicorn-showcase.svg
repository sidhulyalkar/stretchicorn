<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Stretchicorn gameplay showcase</title>
<desc id="desc">A visual overview of Stretchicorn's core two-point control mechanic, projectile language, 13-trial campaign, and Style-based replay loop.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07050d"/><stop offset=".55" stop-color="#14091f"/><stop offset="1" stop-color="#241035"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b1128" stop-opacity=".92"/><stop offset="1" stop-color="#0d0915" stop-opacity=".92"/></linearGradient>
  <radialGradient id="body"><stop stop-color="#fff"/><stop offset=".72" stop-color="#f5edff"/><stop offset="1" stop-color="#c7b3df"/></radialGradient>
  <linearGradient id="gold"><stop stop-color="#fff1a2"/><stop offset="1" stop-color="#ffb437"/></linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="820" rx="32" fill="url(#bg)"/>
<text x="700" y="62" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" text-anchor="middle" letter-spacing="2">STRETCHICORN · THE GAME IN FOUR IDEAS</text>
<text x="700" y="94" fill="#c9b9d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="1.2">ONE SPRING MECHANIC BECOMES MOVEMENT · COMBAT · DEFENSE · MASTERY</text>

<!-- card 1 -->
<g transform="translate(58 132)">
  <rect width="622" height="288" rx="22" fill="url(#card)" stroke="#4d3560" stroke-width="2"/>
  <text x="32" y="42" fill="#ffcf67" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">01 · TWO CONTROL POINTS, ONE SPRING</text>
  <text x="32" y="70" fill="#b9a9c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Move the vulnerable body. Aim the safe horn. Store tension between them.</text>
  <ellipse cx="128" cy="166" rx="55" ry="46" fill="url(#body)"/>
  <path d="M122 163 C114 151 101 161 122 181 C143 161 130 151 122 163Z" fill="#ff4f87"/>
  <text x="128" y="234" fill="#ff7ba8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle">WASD · BODY</text>
  <g fill="none" stroke-linecap="round" stroke-width="8" filter="url(#glow)">
    <path d="M181 144 C270 130 356 130 444 144" stroke="#ff5d8f"/>
    <path d="M181 153 C270 140 356 140 444 153" stroke="#ff9f43"/>
    <path d="M181 162 C270 150 356 150 444 162" stroke="#ffe45a"/>
    <path d="M181 171 C270 160 356 160 444 171" stroke="#6fe38a"/>
    <path d="M181 180 C270 170 356 170 444 180" stroke="#61c8ff"/>
    <path d="M181 189 C270 180 356 180 444 189" stroke="#b28dff"/>
  </g>
  <text x="312" y="222" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle">STRETCH → CHARGE → SNAP</text>
  <ellipse cx="500" cy="166" rx="49" ry="42" fill="url(#body)"/>
  <path d="M530 157 L589 169 L532 180Z" fill="url(#gold)"/>
  <circle cx="492" cy="160" r="5" fill="#17101f"/><circle cx="494" cy="158" r="1.7" fill="#fff"/>
  <text x="500" y="234" fill="#76dfff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle">MOUSE / ARROWS · HORN</text>
  <rect x="171" y="250" width="282" height="24" rx="12" fill="#130c1a" stroke="#564064"/>
  <text x="312" y="267" fill="#d9cfe1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle">CLICK / SPACE · RAINBOW SNAP</text>
</g>

<!-- card 2 -->
<g transform="translate(720 132)">
  <rect width="622" height="288" rx="22" fill="url(#card)" stroke="#4d3560" stroke-width="2"/>
  <text x="32" y="42" fill="#61c8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">02 · PROJECTILES ARE A VISUAL LANGUAGE</text>
  <text x="32" y="70" fill="#b9a9c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Color tells you whether danger can become opportunity.</text>
  <circle cx="128" cy="156" r="38" fill="#f2b432" stroke="#ffe77a" stroke-width="6" filter="url(#glow)"/>
  <circle cx="116" cy="144" r="9" fill="#fff4ba" opacity=".8"/>
  <text x="128" y="218" fill="#ffe16a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" text-anchor="middle">GOLD</text>
  <text x="128" y="242" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">GRAZE +13 · PARRY +25</text>
  <path d="M300 156 L347 114 L394 156 L347 198Z" fill="#54d9ff" stroke="#b7f0ff" stroke-width="5" filter="url(#glow)"/>
  <text x="347" y="218" fill="#75e3ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" text-anchor="middle">CYAN</text>
  <text x="347" y="242" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">DODGE ONLY · PIERCES DASH</text>
  <path d="M458 156 C500 122 540 122 580 156" fill="none" stroke="#ffe16a" stroke-width="4" stroke-dasharray="9 8"/>
  <path d="M570 145 L592 156 L570 167Z" fill="#ffe16a"/>
  <text x="520" y="205" fill="#d9cfe1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle">RETURN x2 / x3 / x4</text>
  <text x="520" y="228" fill="#9f91ab" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">distance rewards precision</text>
</g>

<!-- card 3 -->
<g transform="translate(58 458)">
  <rect width="622" height="300" rx="22" fill="url(#card)" stroke="#4d3560" stroke-width="2"/>
  <text x="32" y="42" fill="#b28dff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">03 · 13 TRIALS BUILD ONE VOCABULARY</text>
  <text x="32" y="70" fill="#b9a9c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Mechanics recombine instead of resetting every level.</text>
  <line x1="54" y1="136" x2="566" y2="136" stroke="#44304f" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" text-anchor="middle">
    <circle cx="74" cy="136" r="10" fill="#6fe38a"/><text x="74" y="170" fill="#cfd7d2">1</text>
    <circle cx="230" cy="136" r="16" fill="#ffcf67"/><text x="230" y="141" fill="#151019">5</text><text x="230" y="176" fill="#ffcf67">HUSK</text>
    <circle cx="390" cy="136" r="16" fill="#61c8ff"/><text x="390" y="141" fill="#151019">9</text><text x="390" y="176" fill="#61c8ff">COLONEL</text>
    <circle cx="552" cy="136" r="19" fill="#b28dff"/><text x="552" y="141" fill="#151019">13</text><text x="552" y="176" fill="#c8adff">PRIME</text>
  </g>
  <rect x="34" y="210" width="128" height="54" rx="12" fill="#11151a" stroke="#4e705c"/><text x="98" y="233" fill="#6fe38a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">EASY</text><text x="98" y="251" fill="#b8c6bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" text-anchor="middle">FIRST FLIGHT</text>
  <rect x="176" y="210" width="128" height="54" rx="12" fill="#11151a" stroke="#45474f"/><text x="240" y="233" fill="#e7e4ea" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">NORMAL</text><text x="240" y="251" fill="#9da1a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" text-anchor="middle">BASELINE</text>
  <rect x="318" y="210" width="128" height="54" rx="12" fill="#11151a" stroke="#6b4b4b"/><text x="382" y="233" fill="#ffb070" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">HARD</text><text x="382" y="251" fill="#b8a49a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" text-anchor="middle">MIXED PRESSURE</text>
  <rect x="460" y="210" width="128" height="54" rx="12" fill="#17101f" stroke="#825ba2"/><text x="524" y="233" fill="#caa7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">IMPOSSIBLE</text><text x="524" y="251" fill="#b4a0c3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" text-anchor="middle">ENCORE</text>
</g>

<!-- card 4 -->
<g transform="translate(720 458)">
  <rect width="622" height="300" rx="22" fill="url(#card)" stroke="#4d3560" stroke-width="2"/>
  <text x="32" y="42" fill="#ff7da8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">04 · WINNING AND MASTERY ARE DIFFERENT</text>
  <text x="32" y="70" fill="#b9a9c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Restore the sky to win. Style tells you how beautifully you did it.</text>
  <text x="50" y="126" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">STYLE 4367</text>
  <text x="50" y="157" fill="#ffe16a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">BEST 5120</text>
  <text x="50" y="189" fill="#c8bacf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">TIME 184s · ♥ 8/13</text>
  <text x="50" y="228" fill="#9f91ab" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Per-difficulty Best persists locally.</text>
  <g transform="translate(416 166)" filter="url(#glow)">
    <circle r="24" fill="#fff8d8"/>
    <g fill="#fff8d8"><circle cx="-24" cy="-6" r="17"/><circle cx="21" cy="-12" r="18"/><circle cx="-11" cy="19" r="18"/><circle cx="26" cy="18" r="15"/></g>
    <circle cx="2" cy="5" r="12" fill="#ffd24a"/>
    <g fill="none" stroke-width="5"><circle r="54" stroke="#ff5d8f"/><circle r="68" stroke="#ff9f43"/><circle r="82" stroke="#ffe45a"/><circle r="96" stroke="#6fe38a"/><circle r="110" stroke="#61c8ff"/><circle r="124" stroke="#b28dff"/></g>
  </g>
  <text x="416" y="270" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle">COBTOPUS → RAINBOW POPCORN</text>
</g>
</svg>